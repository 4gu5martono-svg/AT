    const formatIDR = (number) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,

      }).format(number);
    };

    const formatDate = (dateString) => {
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('id-ID', options);
    };

    const ThreeDCartoon = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        let scene, camera, renderer, animationId;

        const init = () => {
          const THREE = window.THREE;
          if (!THREE || !mountRef.current) return;

          scene = new THREE.Scene();
          camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
          camera.position.z = 5;

          renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
          renderer.setSize(120, 120);
          mountRef.current.innerHTML = '';
          mountRef.current.appendChild(renderer.domElement);

          const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
          scene.add(ambientLight);
          const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
          dirLight.position.set(2, 5, 3);
          scene.add(dirLight);

          const motherGroup = new THREE.Group();

          const headGeo = new THREE.SphereGeometry(0.82, 32, 32);
          const skinMat = new THREE.MeshPhongMaterial({ color: 0xffdcb1 });
          const head = new THREE.Mesh(headGeo, skinMat);
          motherGroup.add(head);

          const hairMat = new THREE.MeshPhongMaterial({ color: 0x2c1b18 });
          const hairBaseGeo = new THREE.SphereGeometry(0.85, 32, 32, 0, Math.PI * 2, 0, Math.PI / 1.8);
          const hairBase = new THREE.Mesh(hairBaseGeo, hairMat);
          motherGroup.add(hairBase);

          const bangsGeo = new THREE.CylinderGeometry(0.88, 0.88, 0.4, 32, 1, false, 0, Math.PI / 2.3);
          const bangs = new THREE.Mesh(bangsGeo, hairMat);
          bangs.rotation.x = Math.PI / 2;
          bangs.position.set(0, 0.3, 0.1); 
          motherGroup.add(bangs);

          const eyeGeo = new THREE.CircleGeometry(0.08, 16);
          const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
          const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
          leftEye.position.set(-0.3, 0.05, 0.84);
          const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
          rightEye.position.set(0.3, 0.05, 0.84);
          motherGroup.add(leftEye);
          motherGroup.add(rightEye);

          const blushGeo = new THREE.CircleGeometry(0.12, 16);
          const blushMat = new THREE.MeshBasicMaterial({ color: 0xff88aa, transparent: true, opacity: 0.6 });
          const leftBlush = new THREE.Mesh(blushGeo, blushMat);
          leftBlush.position.set(-0.45, -0.15, 0.80);
          const rightBlush = new THREE.Mesh(blushGeo, blushMat);
          rightBlush.position.set(0.45, -0.15, 0.80);
          motherGroup.add(leftBlush);
          motherGroup.add(rightBlush);

          const mouthGeo = new THREE.CircleGeometry(0.06, 16, 0, Math.PI);
          const mouthMat = new THREE.MeshBasicMaterial({ color: 0xaa3333 });
          const mouth = new THREE.Mesh(mouthGeo, mouthMat);
          mouth.position.set(0, -0.2, 0.83);
          mouth.rotation.z = Math.PI;
          motherGroup.add(mouth);

          scene.add(motherGroup);
          motherGroup.position.y = -2;

          let clock = new THREE.Clock();
          let state = 'hidden';
          let timer = 0;
          let targetX = 0;

          const animate = () => {
            animationId = requestAnimationFrame(animate);
            const dt = clock.getDelta();
            timer += dt;

            if (state === 'hidden' && timer > 2) {
              state = 'popping';
              timer = 0;
              targetX = (Math.random() - 0.5) * 1.5; 
              motherGroup.position.x = targetX;
              
              const exp = Math.random();
              if (exp < 0.33) {
                 leftEye.scale.set(1, 0.2, 1); rightEye.scale.set(1, 0.2, 1);
                 mouth.rotation.z = Math.PI;
              } else if (exp < 0.66) {
                 leftEye.scale.set(1, 1.5, 1); rightEye.scale.set(1, 1.5, 1);
                 mouth.rotation.z = 0;
              } else {
                 leftEye.scale.set(1, 1, 1); rightEye.scale.set(1, 1, 1);
                 mouth.rotation.z = Math.PI;
              }
            } else if (state === 'popping') {
              motherGroup.position.y += 2 * dt;
              if (motherGroup.position.y >= 0) state = 'visible';
            } else if (state === 'visible' && timer > 4) {
              state = 'hiding';
              timer = 0;
            } else if (state === 'hiding') {
              motherGroup.position.y -= 2 * dt;
              if (motherGroup.position.y <= -2) state = 'hidden';
            }

            motherGroup.rotation.y = Math.sin(clock.getElapsedTime()) * 0.2;
            motherGroup.rotation.z = Math.sin(clock.getElapsedTime() * 0.5) * 0.1;

            renderer.render(scene, camera);
          };

          animate();
        };

        if (!window.THREE) {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
          script.onload = init;
          document.head.appendChild(script);
        } else {
          init();
        }

        return () => {
          if (animationId) cancelAnimationFrame(animationId);
          if (renderer) renderer.dispose();
        };
      }, []);

      return (
        <div 
          ref={mountRef} 
          className="absolute bottom-0 right-0 pointer-events-none z-0" 
          style={{ width: 120, height: 120, transform: 'translate(10%, 20%)' }} 
        />
      );
    };

    function InvoicePreviewModal({ tx, onClose }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!tx || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 800;

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = tx.type === 'income' ? '#10b981' : '#f43f5e';
        ctx.fillRect(0, 0, canvas.width, 150);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('INVOICE TRANSAKSI', canvas.width / 2, 80);

        ctx.fillStyle = '#334155';
        ctx.font = 'bold 60px sans-serif';
        ctx.fillText(formatIDR(tx.amount), canvas.width / 2, 250);

        ctx.font = '30px sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText(tx.description, canvas.width / 2, 310);

        ctx.textAlign = 'left';
        ctx.font = '24px sans-serif';
        ctx.fillStyle = '#475569';
        const startY = 400;
        const lineHeight = 50;

        ctx.fillText(`Jenis: ${tx.type === 'income' ? 'Pemasukan' : 'Pengeluaran'}`, 50, startY);
        ctx.fillText(`Tanggal: ${formatDate(tx.date)}`, 50, startY + lineHeight);
        ctx.fillText(`Kategori: ${tx.category}`, 50, startY + lineHeight * 2);

        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(50, 700, 500, 2);
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.font = 'italic 20px sans-serif';
        ctx.fillText('Dibuat otomatis dari aplikasi Agus & Triya', canvas.width / 2, 750);
      }, [tx]);

      const handleShare = async () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'invoice.jpg', { type: 'image/jpeg' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Invoice Transaksi',
                text: 'Berikut adalah invoice transaksi.',
              });
            } catch (err) {
              console.error(err);
            }
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Invoice_${tx.date}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            window.open(`https://wa.me/6285156610321`, '_blank');
          }
        }, 'image/jpeg', 0.9);
      };

      if (!tx) return null;

      return (
        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4">
           <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}></div>
           <div className="relative bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col items-center max-w-sm w-full animate-pop-in">
             <div className="w-full bg-slate-100 p-4 flex justify-between items-center border-b border-slate-200">
               <h3 className="font-bold text-slate-700">Pratinjau Invoice</h3>
               <button onClick={onClose} className="hover:bg-slate-200 p-1 rounded-full transition-colors"><IconX className="w-6 h-6 text-slate-500"/></button>
             </div>
             <div className="p-4 w-full flex justify-center bg-slate-50">
               <canvas ref={canvasRef} className="w-full h-auto rounded-xl shadow-sm border border-slate-200" style={{maxWidth: '300px'}}></canvas>
             </div>
             <div className="p-4 w-full border-t border-slate-100 bg-white">
               <button onClick={handleShare} className="w-full bg-emerald-500 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-emerald-600 transition-colors active:scale-95">
                 <IconWhatsApp className="w-5 h-5"/> Bagikan / Unduh WA
               </button>
             </div>
           </div>
        </div>
      );
    }

    // Mengubah function utamanya dari "export default function" menjadi "function" biasa
    function HouseholdManagerApp() {
      const [activeTab, setActiveTab] = useState('dash_money');
      const [transactions, setTransactions] = useState(initialTransactions);
      const [assets, setAssets] = useState(initialAssets);
      
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [currencyRates, setCurrencyRates] = useState(initialCurrencyRates);
      const [txModal, setTxModal] = useState({ isOpen: false, type: 'expense' });
      const [invoicePreview, setInvoicePreview] = useState(null);

      const [accounts, setAccounts] = useState(initialAccounts);
      const [isAddingAccount, setIsAddingAccount] = useState(false);
      const [newAccountData, setNewAccountData] = useState({ bank: '', owner: '', number: '' });

      useEffect(() => {
        let audioCtx;
        
        const initAudio = () => {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playSound = (type = 'type') => {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          if (type === 'type') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
          } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.04);
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
          }
        };

        const handleInteraction = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
            initAudio();
            if (e.type === 'keydown') {
              if (['Backspace', 'Enter', ' '].includes(e.key)) playSound('click');
              else playSound('type');
            } else if (e.type === 'click') {
              playSound('type');
            }
          } else if (e.type === 'click') {
            const isInteractive = e.target.closest('button, a, select, [role="button"]');
            if (isInteractive) {
              initAudio();
              playSound('click');
            }
          }
        };

        const firstInteraction = () => {
          initAudio();
          document.removeEventListener('click', firstInteraction);
        };
        
        document.addEventListener('click', firstInteraction);
        document.addEventListener('keydown', handleInteraction);
        document.addEventListener('click', handleInteraction);

        return () => {
          document.removeEventListener('keydown', handleInteraction);
          document.removeEventListener('click', handleInteraction);
          document.removeEventListener('click', firstInteraction);
          if (audioCtx) audioCtx.close();
        };
      }, []);

      useEffect(() => {
        const parsePrice = (priceStr) => {
          const numStr = priceStr.replace(/[^0-9]/g, '');
          const suffix = priceStr.includes('/kg') ? '/kg' : '';
          return { value: parseInt(numStr, 10), suffix };
        };

        const formatPriceStr = (val, suffix) => {
          const formattedNum = val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          return `Rp${formattedNum}${suffix}`;
        };

        const interval = setInterval(() => {
          setTickerPrices(prevPrices => prevPrices.map(item => {
            if (Math.random() > 0.6) {
              const { value, suffix } = parsePrice(item.price);
              const change = Math.floor(Math.random() * 11 - 5) * 100; 
              if (change === 0) return { ...item, trend: 'stable' };
              const newValue = Math.max(1000, value + change); 
              return { ...item, price: formatPriceStr(newValue, suffix), trend: change > 0 ? 'up' : 'down' };
            }
            if (Math.random() > 0.8) return { ...item, trend: 'stable' };
            return item;
          }));
        }, 5000);

        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const currencyInterval = setInterval(() => {
          setCurrencyRates(prevRates => prevRates.map(c => {
             const change = Math.floor(Math.random() * 21) - 10;
             if (change === 0) return { ...c, trend: 'stable' };
             return {
                ...c,
                rate: Math.max(10, c.rate + change),
                trend: change > 0 ? 'up' : 'down'
             };
          }));
        }, 7000);
        return () => clearInterval(currencyInterval);
      }, []);

      const handleAddTransaction = (newTx) => {
        setTransactions([newTx, ...transactions]);
        setTxModal({ isOpen: false, type: 'expense' }); 
      };

      const navigation = [
        { id: 'dash_money', name: 'Dasbor Uang', icon: IconWallet },
        { id: 'dash_asset', name: 'Dasbor Aset', icon: IconDashboard },
        { id: 'finance', name: 'Transaksi', icon: IconFinance },
        { id: 'assets', name: 'Inventaris', icon: IconAssets },
        { id: 'rekening', name: 'Buku Rekening', icon: IconBank },
      ];

      const handleNavClick = (id) => {
        if (id === 'rekening') {
          setIsAccountSidebarOpen(true);
          setIsMobileMenuOpen(false);
        } else {
          setActiveTab(id);
          setIsMobileMenuOpen(false);
          setIsAccountSidebarOpen(false);
        }
      };

      const handleUploadStruk = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = (e) => {
          if (e.target.files && e.target.files.length > 0) {
            window.open('https://drive.google.com/drive/u/0/folders/10M9upjJ88TE2ApSaM54wU5ezUOoPlH_v', '_blank');
          }
        };
        input.click();
      };

      return (
        <div className="flex flex-col h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 font-sans text-slate-800 overflow-hidden">
          <style dangerouslySetInnerHTML={{ __html: `
            @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
            @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 40% { opacity: 1; transform: scale(1.02); } 100% { opacity: 1; transform: scale(1); } }
            @keyframes marquee-continuous { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
            @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
            @keyframes shimmer { 0% { transform: translateX(-100%) skewX(-15deg); } 100% { transform: translateX(200%) skewX(-15deg); } }
            .animate-shimmer { position: relative; overflow: hidden; }
            .animate-shimmer::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%); transform: translateX(-100%) skewX(-15deg); animation: shimmer 3.5s infinite; pointer-events: none; }
            .animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
            .animate-pop-in { animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
            .stagger-1 { animation-delay: 100ms; } .stagger-2 { animation-delay: 200ms; } .stagger-3 { animation-delay: 300ms; } .stagger-4 { animation-delay: 400ms; }
          `}} />

          {/* Bismillah Header */}
          <div className="w-full bg-emerald-600/90 backdrop-blur-md text-white py-1.5 overflow-hidden z-[60] flex-shrink-0 shadow-sm border-b border-emerald-500/50">
            <div className="flex animate-[marquee-continuous_25s_linear_infinite] whitespace-nowrap items-center font-medium gap-3 text-sm md:text-base">
              <span className="text-xl leading-none pt-1" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
              <span className="text-emerald-200/80 mx-2">•</span>
              <span className="italic text-emerald-50">Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang</span>
              <span className="text-emerald-200/80 mx-2">•</span>
            </div>
          </div>

          {/* Ticker Harga Pasar */}
          <div className="relative w-full bg-amber-500/90 backdrop-blur-md text-white overflow-hidden z-[55] flex-shrink-0 border-b border-amber-400/50 shadow-sm flex items-center h-10 cursor-default">
            <div className="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-amber-600 via-amber-600 to-transparent w-48 md:w-60 flex items-center px-3 md:px-4 z-10">
              <span className="font-bold text-[10px] md:text-xs uppercase tracking-wider text-white flex items-center gap-1.5 shadow-sm">
                <IconTrendingUp className="w-3.5 h-3.5 md:w-4 md:h-4" /> Harga Pasar Purbalingga
              </span>
            </div>
            
            <div className="flex w-max animate-[marquee-continuous_40s_linear_infinite] hover:[animation-play-state:paused] pl-8">
              {[...tickerPrices, ...tickerPrices].map((p, i) => (
                <div key={`ticker-${p.item}-${i}`} className="flex items-center gap-2 px-3 md:px-4 text-xs md:text-sm font-medium whitespace-nowrap transition-all duration-300">
                  <span className="text-lg md:text-xl leading-none drop-shadow-sm">{p.icon}</span>
                  <span className="text-amber-50">{p.item}</span>
                  <span className={`font-bold px-2 py-0.5 rounded-md shadow-inner transition-colors duration-500 ${p.trend === 'up' ? 'bg-rose-500 text-white' : p.trend === 'down' ? 'bg-emerald-500 text-white' : 'bg-amber-600/70 text-white'}`}>
                    {p.price}
                  </span>
                  {p.trend === 'up' && <IconTrendingUp className="w-3.5 h-3.5 text-rose-200 drop-shadow-md animate-bounce" title="Harga Naik" />}
                  {p.trend === 'down' && <IconTrendingDown className="w-3.5 h-3.5 text-emerald-200 drop-shadow-md animate-bounce" title="Harga Turun" />}
                  {p.trend === 'stable' && <span className="text-amber-200 text-[10px] md:text-xs" title="Harga Stabil">●</span>}
                  <span className="text-amber-400/40 ml-2">|</span>
                </div>
              ))}
            </div>
          </div>

          <div className="flex flex-1 overflow-hidden relative">
            
            {/* Mobile Sidebar Overlay */}
            {isMobileMenuOpen && (
              <div className="md:hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[70] transition-opacity" onClick={() => setIsMobileMenuOpen(false)}/>
            )}

            {/* Buku Rekening Sidebar (Left Slide) */}
            {isAccountSidebarOpen && (
              <div className="fixed inset-0 z-[90] flex">
                <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onClick={() => setIsAccountSidebarOpen(false)}></div>
                <div className="relative w-80 max-w-[85%] bg-white/90 backdrop-blur-2xl h-full shadow-[24px_0_40px_-12px_rgba(0,0,0,0.15)] animate-[slideRight_0.3s_ease-out] flex flex-col border-r border-white/50">
                   <div className="p-6 flex items-center justify-between border-b border-slate-200/50 bg-white/50">
                      <div className="flex items-center gap-3">
                         <div className="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center shadow-sm">
                           <IconBank className="w-6 h-6"/>
                         </div>
                         <h2 className="text-lg font-bold text-slate-800">Buku Rekening</h2>
                      </div>
                      <button onClick={() => setIsAccountSidebarOpen(false)} className="p-2 bg-slate-100 hover:bg-rose-100 hover:text-rose-600 rounded-full transition-colors"><IconX className="w-5 h-5"/></button>
                   </div>
                   
                   <div className="flex-1 overflow-y-auto p-5 space-y-4">
                      {/* Account Cards */}
                      {accounts.map((acc) => (
                         <div key={acc.id} className={`p-5 bg-gradient-to-br ${acc.gradient} rounded-2xl text-white shadow-lg relative group overflow-hidden animate-shimmer`}>
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mt-10 -mr-10 pointer-events-none mix-blend-overlay"></div>
                            <p className="text-xs opacity-80 font-medium uppercase tracking-widest">{acc.bank} - {acc.owner}</p>
                            <p className="font-bold text-2xl tracking-widest mt-2 drop-shadow-sm">{acc.number}</p>
                            <div className="absolute top-4 right-4 opacity-0 group-hover:opacity-100 flex gap-2 transition-opacity duration-300 z-10">
                               <button className="p-1.5 bg-white/20 hover:bg-orange-500 rounded-lg shadow-sm backdrop-blur-sm transition-colors" title="Edit">
                                 <IconCog className="w-4 h-4 text-white"/>
                               </button>
                            </div>
                         </div>
                      ))}
                   </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // 5. Render komponen utama ke dalam div#root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HouseholdManagerApp />);
  </script>
</body>
</html>
