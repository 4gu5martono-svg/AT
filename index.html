    // --- UTILITIES ---
    const formatIDR = (number) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0,
      }).format(number);
    };

    const formatDate = (dateString) => {
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('id-ID', options);
    };

    // --- COMPONENTS ---
    const ThreeDCartoon = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        let scene, camera, renderer, animationId;

        const init = () => {
          const THREE = window.THREE;
          if (!THREE || !mountRef.current) return;

          scene = new THREE.Scene();
          camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
          camera.position.z = 5;

          renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
          renderer.setSize(120, 120);
          mountRef.current.innerHTML = '';
          mountRef.current.appendChild(renderer.domElement);

          const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
          scene.add(ambientLight);
          const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
          dirLight.position.set(2, 5, 3);
          scene.add(dirLight);

          const motherGroup = new THREE.Group();

          const headGeo = new THREE.SphereGeometry(0.82, 32, 32);
          const skinMat = new THREE.MeshPhongMaterial({ color: 0xffdcb1 });
          const head = new THREE.Mesh(headGeo, skinMat);
          motherGroup.add(head);

          const hairMat = new THREE.MeshPhongMaterial({ color: 0x2c1b18 });
          const hairBaseGeo = new THREE.SphereGeometry(0.85, 32, 32, 0, Math.PI * 2, 0, Math.PI / 1.8);
          const hairBase = new THREE.Mesh(hairBaseGeo, hairMat);
          motherGroup.add(hairBase);

          const bangsGeo = new THREE.CylinderGeometry(0.88, 0.88, 0.4, 32, 1, false, 0, Math.PI / 2.3);
          const bangs = new THREE.Mesh(bangsGeo, hairMat);
          bangs.rotation.x = Math.PI / 2;
          bangs.position.set(0, 0.3, 0.1); 
          motherGroup.add(bangs);

          const eyeGeo = new THREE.CircleGeometry(0.08, 16);
          const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
          const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
          leftEye.position.set(-0.3, 0.05, 0.84);
          const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
          rightEye.position.set(0.3, 0.05, 0.84);
          motherGroup.add(leftEye);
          motherGroup.add(rightEye);

          const blushGeo = new THREE.CircleGeometry(0.12, 16);
          const blushMat = new THREE.MeshBasicMaterial({ color: 0xff88aa, transparent: true, opacity: 0.6 });
          const leftBlush = new THREE.Mesh(blushGeo, blushMat);
          leftBlush.position.set(-0.45, -0.15, 0.80);
          const rightBlush = new THREE.Mesh(blushGeo, blushMat);
          rightBlush.position.set(0.45, -0.15, 0.80);
          motherGroup.add(leftBlush);
          motherGroup.add(rightBlush);

          const mouthGeo = new THREE.CircleGeometry(0.06, 16, 0, Math.PI);
          const mouthMat = new THREE.MeshBasicMaterial({ color: 0xaa3333 });
          const mouth = new THREE.Mesh(mouthGeo, mouthMat);
          mouth.position.set(0, -0.2, 0.83);
          mouth.rotation.z = Math.PI;
          motherGroup.add(mouth);

          scene.add(motherGroup);
          motherGroup.position.y = -2;

          let clock = new THREE.Clock();
          let state = 'hidden';
          let timer = 0;
          let targetX = 0;

          const animate = () => {
            animationId = requestAnimationFrame(animate);
            const dt = clock.getDelta();
            timer += dt;

            if (state === 'hidden' && timer > 2) {
              state = 'popping';
              timer = 0;
              targetX = (Math.random() - 0.5) * 1.5; 
              motherGroup.position.x = targetX;
              
              const exp = Math.random();
              if (exp < 0.33) {
                 leftEye.scale.set(1, 0.2, 1); rightEye.scale.set(1, 0.2, 1);
                 mouth.rotation.z = Math.PI;
              } else if (exp < 0.66) {
                 leftEye.scale.set(1, 1.5, 1); rightEye.scale.set(1, 1.5, 1);
                 mouth.rotation.z = 0;
              } else {
                 leftEye.scale.set(1, 1, 1); rightEye.scale.set(1, 1, 1);
                 mouth.rotation.z = Math.PI;
              }
            } else if (state === 'popping') {
              motherGroup.position.y += 2 * dt;
              if (motherGroup.position.y >= 0) state = 'visible';
            } else if (state === 'visible' && timer > 4) {
              state = 'hiding';
              timer = 0;
            } else if (state === 'hiding') {
              motherGroup.position.y -= 2 * dt;
              if (motherGroup.position.y <= -2) state = 'hidden';
            }

            motherGroup.rotation.y = Math.sin(clock.getElapsedTime()) * 0.2;
            motherGroup.rotation.z = Math.sin(clock.getElapsedTime() * 0.5) * 0.1;

            renderer.render(scene, camera);
          };

          animate();
        };

        if (!window.THREE) {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
          script.onload = init;
          document.head.appendChild(script);
        } else {
          init();
        }

        return () => {
          if (animationId) cancelAnimationFrame(animationId);
          if (renderer) renderer.dispose();
        };
      }, []);

      return (
        <div 
          ref={mountRef} 
          className="fixed bottom-0 right-0 pointer-events-none z-[100]" 
          style={{ width: 120, height: 120, transform: 'translate(10%, 20%)' }} 
        />
      );
    };

    function InvoicePreviewModal({ tx, onClose }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!tx || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 800;

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = tx.type === 'income' ? '#10b981' : '#f43f5e';
        ctx.fillRect(0, 0, canvas.width, 150);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('INVOICE TRANSAKSI', canvas.width / 2, 80);

        ctx.fillStyle = '#334155';
        ctx.font = 'bold 60px sans-serif';
        ctx.fillText(formatIDR(tx.amount), canvas.width / 2, 250);

        ctx.font = '30px sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText(tx.description, canvas.width / 2, 310);

        ctx.textAlign = 'left';
        ctx.font = '24px sans-serif';
        ctx.fillStyle = '#475569';
        const startY = 400;
        const lineHeight = 50;

        ctx.fillText(`Jenis: ${tx.type === 'income' ? 'Pemasukan' : 'Pengeluaran'}`, 50, startY);
        ctx.fillText(`Tanggal: ${formatDate(tx.date)}`, 50, startY + lineHeight);
        ctx.fillText(`Kategori: ${tx.category}`, 50, startY + lineHeight * 2);

        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(50, 700, 500, 2);
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.font = 'italic 20px sans-serif';
        ctx.fillText('Dibuat otomatis dari aplikasi Agus & Triya', canvas.width / 2, 750);
      }, [tx]);

      const handleShare = async () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'invoice.jpg', { type: 'image/jpeg' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Invoice Transaksi',
                text: 'Berikut adalah invoice transaksi.',
              });
            } catch (err) {
              console.error(err);
            }
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Invoice_${tx.date}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            window.open(`https://wa.me/6285156610321`, '_blank');
          }
        }, 'image/jpeg', 0.9);
      };

      if (!tx) return null;

      return (
        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4">
           <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}></div>
           <div className="relative bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col items-center max-w-sm w-full animate-pop-in">
             <div className="w-full bg-slate-100 p-4 flex justify-between items-center border-b border-slate-200">
               <h3 className="font-bold text-slate-700">Pratinjau Invoice</h3>
               <button onClick={onClose} className="hover:bg-slate-200 p-1 rounded-full transition-colors"><IconX className="w-6 h-6 text-slate-500"/></button>
             </div>
             <div className="p-4 w-full flex justify-center bg-slate-50">
               <canvas ref={canvasRef} className="w-full h-auto rounded-xl shadow-sm border border-slate-200" style={{maxWidth: '300px'}}></canvas>
             </div>
             <div className="p-4 w-full border-t border-slate-100 bg-white">
               <button onClick={handleShare} className="w-full bg-emerald-500 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-emerald-600 transition-colors active:scale-95">
                 <IconWhatsApp className="w-5 h-5"/> Bagikan / Unduh WA
               </button>
             </div>
           </div>
        </div>
      );
    }

    // --- INITIAL DATA ---
    const initialTransactions = [
      { id: 1, type: 'income', amount: 8500000, description: 'Gaji Suami', category: 'Gaji', date: '2026-06-01' },

    // --- MAIN APP COMPONENT ---
    function HouseholdManagerApp() {
      const [activeTab, setActiveTab] = useState('dash_money');
      const [transactions, setTransactions] = useState(initialTransactions);
      const [assets, setAssets] = useState(initialAssets);
      
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isAccountSidebarOpen, setIsAccountSidebarOpen] = useState(false);
      const [tickerPrices, setTickerPrices] = useState(marketPrices);
      const [currencyRates, setCurrencyRates] = useState(initialCurrencyRates);
      
      // Modals State
      const [txModalOpen, setTxModalOpen] = useState(false);
      const [assetModalOpen, setAssetModalOpen] = useState(false);
      const [invoicePreview, setInvoicePreview] = useState(null);

      // Forms State
      const [newTx, setNewTx] = useState({ type: 'expense', amount: '', description: '', category: 'Sembako', date: new Date().toISOString().split('T')[0] });
      const [newAsset, setNewAsset] = useState({ name: '', value: '', category: 'Lainnya' });

      const [accounts, setAccounts] = useState(initialAccounts);
      const [isAddingAccount, setIsAddingAccount] = useState(false);
      const [newAccountData, setNewAccountData] = useState({ bank: '', owner: '', number: '', balance: '' });

      // Audio Effect
      useEffect(() => {
        let audioCtx;
        
        const initAudio = () => {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playSound = (type = 'type') => {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          if (type === 'type') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
          } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.04);
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
          }
        };

        const handleInteraction = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
            initAudio();
            if (e.type === 'keydown') {
              if (['Backspace', 'Enter', ' '].includes(e.key)) playSound('click');
              else playSound('type');
            } else if (e.type === 'click') {
              playSound('type');
            }
          } else if (e.type === 'click') {
            const isInteractive = e.target.closest('button, a, select, [role="button"], .interactive-card');
            if (isInteractive) {
              initAudio();
              playSound('click');
            }
          }
        };

        const firstInteraction = () => {
          initAudio();
          document.removeEventListener('click', firstInteraction);
        };
        
        document.addEventListener('click', firstInteraction);
        document.addEventListener('keydown', handleInteraction);
        document.addEventListener('click', handleInteraction);

        return () => {
          document.removeEventListener('keydown', handleInteraction);
          document.removeEventListener('click', handleInteraction);
          document.removeEventListener('click', firstInteraction);
          if (audioCtx) audioCtx.close();

          return { value: parseInt(numStr, 10), suffix };

        const formatPriceStr = (val, suffix) => {
          const formattedNum = val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          return `Rp${formattedNum}${suffix}`;

          setTickerPrices(prevPrices => prevPrices.map(item => {
            if (Math.random() > 0.6) {
              const { value, suffix } = parsePrice(item.price);
              const change = Math.floor(Math.random() * 11 - 5) * 100; 
              if (change === 0) return { ...item, trend: 'stable' };
              const newValue = Math.max(1000, value + change); 
              return { ...item, price: formatPriceStr(newValue, suffix), trend: change > 0 ? 'up' : 'down' };

                             <p className="text-xs text-slate-500 mb-1">Estimasi Nilai</p>
                             <p className="font-bold text-indigo-600 text-lg">{formatIDR(asset.value)}</p>
                           </div>
                        </div>
                      ))}
                      {assets.length === 0 && (
                        <div className="col-span-full p-8 text-center bg-white rounded-2xl border border-slate-100">
                          <p className="text-slate-500">Belum ada aset yang didaftarkan.</p>
                        </div>
                      )}
                    </div>
                  </div>
                )}
                
                {/* Space for the 3D Avatar so it doesn't cover content */}
                <div className="h-32 w-full"></div>
              </main>
            </div>
            
            <ThreeDCartoon />

            {/* Mobile Sidebar Overlay */}
            {isMobileMenuOpen && (
              <div className="md:hidden fixed inset-0 z-[80] flex">
                <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)}/>
                <div className="relative w-64 bg-white h-full shadow-2xl animate-[slideRight_0.3s_ease-out] flex flex-col">
                  <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                    <span className="font-bold text-slate-800">Menu</span>
                    <button onClick={() => setIsMobileMenuOpen(false)}><IconX className="w-6 h-6 text-slate-500"/></button>
                  </div>
                  <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                    {navigation.map((item) => (
                      <button
                        key={`mob-${item.id}`}
                        onClick={() => handleNavClick(item.id)}
                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium ${
                          activeTab === item.id && item.id !== 'rekening'
                            ? 'bg-purple-100 text-purple-700'
                            : 'text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <item.icon className="w-5 h-5" />
                        {item.name}
                      </button>
                    ))}
                  </nav>
                </div>
              </div>
            )}

            {/* Buku Rekening Sidebar (Right Slide/Overlay) */}
            {isAccountSidebarOpen && (
              <div className="fixed inset-0 z-[90] flex justify-end">
                <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onClick={() => setIsAccountSidebarOpen(false)}></div>
                <div className="relative w-80 max-w-[85%] bg-white/95 backdrop-blur-2xl h-full shadow-2xl flex flex-col border-l border-white/50 animate-[slideRight_0.3s_ease-out]" style={{animationDirection: 'reverse'}}>
                   <div className="p-6 flex items-center justify-between border-b border-slate-200/50 bg-white/50">
                      <div className="flex items-center gap-3">
                         <div className="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center shadow-sm">
                           <IconBank className="w-6 h-6"/>
                         </div>
                         <h2 className="text-lg font-bold text-slate-800">Rekening</h2>
                      </div>
                      <button onClick={() => setIsAccountSidebarOpen(false)} className="p-2 bg-slate-100 hover:bg-rose-100 hover:text-rose-600 rounded-full transition-colors"><IconX className="w-5 h-5"/></button>
                   </div>
                   
                   <div className="flex-1 overflow-y-auto p-5 space-y-4">
                      {accounts.map((acc) => (
                         <div key={acc.id} className={`p-5 bg-gradient-to-br ${acc.gradient} rounded-2xl text-white shadow-lg relative group overflow-hidden animate-shimmer`}>
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mt-10 -mr-10 pointer-events-none mix-blend-overlay"></div>
                            <p className="text-xs opacity-80 font-medium uppercase tracking-widest">{acc.bank} - {acc.owner}</p>
                            <p className="font-bold text-xl tracking-widest mt-2 drop-shadow-sm font-mono">{acc.number}</p>
                            <div className="mt-4 pt-3 border-t border-white/20 flex justify-between items-end">
                               <div>
                                 <p className="text-[10px] uppercase opacity-70 mb-0.5">Saldo</p>
                                 <p className="font-bold text-lg leading-none">{formatIDR(acc.balance)}</p>
                               </div>
                               <button className="p-1.5 bg-white/20 hover:bg-white/40 rounded-lg shadow-sm backdrop-blur-sm transition-colors" title="Edit">
                                 <IconCog className="w-4 h-4 text-white"/>
                               </button>
                            </div>
                         </div>
                      ))}

                      {isAddingAccount ? (
                        <form onSubmit={submitAccount} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                          <h4 className="font-bold text-sm text-slate-700">Tambah Rekening Baru</h4>
                          <input type="text" placeholder="Nama Bank (Cth: BCA)" required className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-purple-500" value={newAccountData.bank} onChange={e=>setNewAccountData({...newAccountData, bank: e.target.value})} />
                          <input type="text" placeholder="Atas Nama" required className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-purple-500" value={newAccountData.owner} onChange={e=>setNewAccountData({...newAccountData, owner: e.target.value})} />
                          <input type="text" placeholder="Nomor Rekening" required className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-purple-500" value={newAccountData.number} onChange={e=>setNewAccountData({...newAccountData, number: e.target.value})} />
                          <input type="number" placeholder="Saldo Awal" required className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-purple-500" value={newAccountData.balance} onChange={e=>setNewAccountData({...newAccountData, balance: e.target.value})} />
                          <div className="flex gap-2 pt-2">
                             <button type="submit" className="flex-1 bg-purple-600 text-white text-sm py-2 rounded-lg font-medium hover:bg-purple-700">Simpan</button>
                             <button type="button" onClick={()=>setIsAddingAccount(false)} className="flex-1 bg-slate-200 text-slate-700 text-sm py-2 rounded-lg font-medium hover:bg-slate-300">Batal</button>
                          </div>
                        </form>
                      ) : (
                        <button onClick={() => setIsAddingAccount(true)} className="w-full py-4 border-2 border-dashed border-slate-300 rounded-2xl text-slate-500 font-medium hover:bg-slate-50 hover:border-purple-400 hover:text-purple-600 transition flex items-center justify-center gap-2">
                           <IconPlus className="w-5 h-5"/> Tambah Rekening
                        </button>
                      )}
                   </div>
                </div>
              </div>
            )}

            {/* Modal Tambah Transaksi */}
            {txModalOpen && (
               <div className="fixed inset-0 z-[110] flex items-center justify-center p-4">
                 <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={()=>setTxModalOpen(false)}></div>
                 <div className="relative bg-white rounded-3xl w-full max-w-md shadow-2xl p-6 animate-pop-in">
                    <div className="flex justify-between items-center mb-6">
                      <h3 className="font-bold text-xl text-slate-800">Catat Transaksi</h3>
                      <button onClick={()=>setTxModalOpen(false)} className="p-2 bg-slate-100 rounded-full hover:bg-rose-100 hover:text-rose-600 transition"><IconX className="w-5 h-5"/></button>
                    </div>
                    <form onSubmit={submitTransaction} className="space-y-4">
                      <div className="flex bg-slate-100 p-1 rounded-xl">
                        <button type="button" onClick={()=>setNewTx({...newTx, type:'expense'})} className={`flex-1 py-2 rounded-lg font-medium text-sm transition ${newTx.type==='expense' ? 'bg-white shadow-sm text-rose-600' : 'text-slate-500'}`}>Pengeluaran</button>
                        <button type="button" onClick={()=>setNewTx({...newTx, type:'income'})} className={`flex-1 py-2 rounded-lg font-medium text-sm transition ${newTx.type==='income' ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-500'}`}>Pemasukan</button>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nominal (Rp)</label>
                        <input type="number" required value={newTx.amount} onChange={e=>setNewTx({...newTx, amount: e.target.value})} className="w-full text-2xl font-bold px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-500 focus:bg-white transition" placeholder="0" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Deskripsi Singkat</label>
                        <input type="text" required value={newTx.description} onChange={e=>setNewTx({...newTx, description: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-500 focus:bg-white transition" placeholder="Beli beras, Gaji, dll" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Kategori</label>
                          <select value={newTx.category} onChange={e=>setNewTx({...newTx, category: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-500 focus:bg-white transition">
                             {newTx.type === 'expense' ? (
                               <>
                                <option>Sembako</option>
                                <option>Tagihan</option>
                                <option>Pendidikan</option>
                                <option>Kesehatan</option>
                                <option>Hiburan</option>
                                <option>Lainnya</option>
                               </>
                             ) : (
                               <>
                                <option>Gaji</option>
                                <option>Bisnis</option>
                                <option>Investasi</option>
                                <option>Pemberian</option>
                                <option>Lainnya</option>
                               </>
                             )}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tanggal</label>
                          <input type="date" required value={newTx.date} onChange={e=>setNewTx({...newTx, date: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-purple-500 focus:bg-white transition text-sm" />
                        </div>
                      </div>
                      <button type="submit" className="w-full bg-purple-600 text-white font-bold py-3.5 rounded-xl mt-4 hover:bg-purple-700 transition active:scale-95 shadow-md shadow-purple-200">
                        Simpan Transaksi
                      </button>
                    </form>
                 </div>
               </div>
            )}

            {/* Modal Tambah Aset */}
            {assetModalOpen && (
               <div className="fixed inset-0 z-[110] flex items-center justify-center p-4">
                 <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={()=>setAssetModalOpen(false)}></div>
                 <div className="relative bg-white rounded-3xl w-full max-w-md shadow-2xl p-6 animate-pop-in">
                    <div className="flex justify-between items-center mb-6">
                      <h3 className="font-bold text-xl text-slate-800">Tambah Inventaris Aset</h3>
                      <button onClick={()=>setAssetModalOpen(false)} className="p-2 bg-slate-100 rounded-full hover:bg-rose-100 hover:text-rose-600 transition"><IconX className="w-5 h-5"/></button>
                    </div>
                    <form onSubmit={submitAsset} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nama Aset</label>
                        <input type="text" required value={newAsset.name} onChange={e=>setNewAsset({...newAsset, name: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition" placeholder="Cth: Emas Antam 5g" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Estimasi Nilai (Rp)</label>
                        <input type="number" required value={newAsset.value} onChange={e=>setNewAsset({...newAsset, value: e.target.value})} className="w-full text-xl font-bold px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition" placeholder="0" />
                      </div>
                      <div>
                          <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Kategori</label>
                          <select value={newAsset.category} onChange={e=>setNewAsset({...newAsset, category: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                              <option>Logam Mulia</option>
                              <option>Kendaraan</option>
                              <option>Elektronik</option>
                              <option>Properti</option>
                              <option>Lainnya</option>
                          </select>
                      </div>
                      <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl mt-4 hover:bg-indigo-700 transition active:scale-95 shadow-md shadow-indigo-200">
                        Simpan Aset
                      </button>
                    </form>
                 </div>
               </div>
            )}

            {/* Invoice Preview Overlays */}
            <InvoicePreviewModal tx={invoicePreview} onClose={() => setInvoicePreview(null)} />

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HouseholdManagerApp />);
  </script>
</body>
</html>
